<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#252824" />
    <meta
      name="description"
      content="Trazo — gestión inteligente de proyectos: dashboard ejecutivo, historial de versiones y alertas explicables. Demo con datos simulados."
    />
    <title>Trazo · Gestión inteligente de proyectos</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('trazo:theme')
          var preference =
            stored === 'light' || stored === 'dark' || stored === 'system'
              ? stored
              : 'system'
          var isDark =
            preference === 'dark' ||
            (preference === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.style.colorScheme = isDark
            ? 'dark'
            : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', isDark ? '#191c19' : '#252824')
        } catch (error) {
          // Sin preferencia disponible se mantiene el tema claro por defecto.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
